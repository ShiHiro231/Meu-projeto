<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login Administrativo</title>
</head>

<body>

    <h1>Área Administrativa</h1>
    {% if erro %}
    <p>{{ erro }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Login:</label>
        <input type="text" name="login">

        <br><br>

        <label>Senha:</label>
        <input type="password" name="senha">

        <br><br>

        <button type="submit">Entrar</button>

    </form>

</body>
</html>
